version: '3.8'

services:
  bot-primary:
    image: albimusic-bot:latest
    container_name: albimusic-bot-primary
    environment:
      - DB_HOST=localhost
      - DB_PORT=5432
      - DB_NAME=albimusic_bot
      - DB_USER=albimusic_user
      - DB_PASSWORD=aXAnAixKT6@?B9
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
      - BOT_PORT=8000
    network_mode: "host"
    restart: unless-stopped

  bot-backup:
    image: albimusic-bot:latest
    container_name: albimusic-bot-backup
    environment:
      - DB_HOST=localhost
      - DB_PORT=5432
      - DB_NAME=albimusic_bot
      - DB_USER=albimusic_user
      - DB_PASSWORD=aXAnAixKT6@?B9
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
      - BOT_PORT=8001
    network_mode: "host"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: albimusic-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - bot-primary
      - bot-backup
    restart: unless-stopped
