events {
    worker_connections 1024;
}

http {
    upstream albimusic_bots {
        server localhost:8000;  # bot-primary
        server localhost:8001;  # bot-backup (будет слушать на другом порту)
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://albimusic_bots;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
