# Nginx конфигурация для VK-бота с webhook YooKassa
# Разместить в: /etc/nginx/sites-available/vk-bot

server {
    listen 80;
    server_name your-domain.com;  # ЗАМЕНИТЬ на ваш домен

    # Логи
    access_log /var/log/nginx/vk-bot-access.log;
    error_log /var/log/nginx/vk-bot-error.log;

    # Webhook YooKassa
    location /webhook/yookassa {
        proxy_pass http://127.0.0.1:8080/webhook/yookassa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        # Размер body (для больших webhook payload)
        client_max_body_size 1M;
    }

    # Статические файлы (если нужны)
    location /static/ {
        alias /root/albimusic-bot/static/;
        expires 30d;
    }

    # Загруженные аудио (для вариант upload_audio_to_server)
    location /uploads/audio/ {
        alias /var/www/uploads/audio/;
        expires 7d;
        
        # Только аудио форматы
        location ~ \.(mp3|wav|ogg|m4a)$ {
            add_header Content-Type audio/mpeg;
        }
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_set_header Host $host;
    }
}

